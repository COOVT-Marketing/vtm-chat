<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTM Chat</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="chat-shell" id="chat-shell" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="/images/logo.svg" alt="" class="brand-mark" width="28" height="28" />
          <h1>VTM Chat</h1>
        </div>
        <div class="me" id="me-name"></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">
            <span>Channels</span>
            <button id="new-channel-btn" title="New channel">+</button>
          </div>
          <div id="channel-list"></div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            <span>Groups</span>
            <button id="new-group-btn" title="New group">+</button>
          </div>
          <div id="group-list"></div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            <span>Direct Messages</span>
            <button id="new-dm-btn" title="New DM">+</button>
          </div>
          <div id="dm-list"></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle-btn">🌙 Dark</button>
        <button class="link-btn" id="logout-btn">Log out</button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <span id="channel-title">Select a channel</span>
        <div class="header-actions">
          <button class="icon-btn" id="call-btn" title="Start video call" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </button>
          <a href="/admin" id="admin-link" style="display:none;">Admin console</a>
        </div>
      </header>

      <div class="message-stream" id="message-stream">
        <div class="empty-state">Select a channel to get started</div>
      </div>

      <div class="typing-indicator" id="typing-indicator"></div>

      <div class="composer" id="composer" style="display:none;">
        <div class="reply-preview" id="reply-preview" style="display:none;"></div>
        <div class="composer-attachment" id="composer-attachment" style="display:none;"></div>
        <div class="voice-recorder" id="voice-recorder" style="display:none;">
          <span class="rec-dot"></span>
          <span id="rec-timer">0:00</span>
          <span class="rec-label">Recording voice message…</span>
          <button type="button" id="rec-cancel-btn" class="link-btn">Cancel</button>
          <button type="button" id="rec-stop-btn" class="btn-primary" style="width:auto; padding:6px 14px;">Stop &amp; send</button>
        </div>
        <div class="composer-row" id="composer-row">
          <button class="icon-btn" id="attach-btn" title="Attach file">📎</button>
          <input type="file" id="file-input" style="display:none;" />
          <input type="text" class="composer-input" id="message-input" placeholder="Message…" autocomplete="off" />
          <button class="icon-btn" id="mic-btn" title="Record voice message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
          </button>
          <button class="send-btn" id="send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- New channel / group / DM modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="auth-card modal-card" id="modal-content"></div>
  </div>

  <!-- Incoming call toast -->
  <div id="incoming-call" class="incoming-call" style="display:none;">
    <img src="/images/logo.svg" alt="" width="32" height="32" />
    <div class="incoming-call-info">
      <div class="incoming-call-name" id="incoming-call-name">Someone</div>
      <div class="incoming-call-sub">is calling you…</div>
    </div>
    <button class="call-action-btn reject" id="reject-call-btn" title="Decline">✕</button>
    <button class="call-action-btn accept" id="accept-call-btn" title="Accept">✓</button>
  </div>

  <!-- Active call overlay -->
  <div id="call-overlay" class="call-overlay" style="display:none;">
    <div class="call-overlay-header">
      <span id="call-with-name">Call</span>
      <span id="call-status" class="call-status">Connecting…</span>
    </div>
    <div class="call-video-grid">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls">
      <button class="call-action-btn mute" id="toggle-mic-btn" title="Mute">🎤</button>
      <button class="call-action-btn mute" id="toggle-cam-btn" title="Camera off">📷</button>
      <button class="call-action-btn hangup" id="hangup-btn" title="Hang up">✕</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/call.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — VTM Chat</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <form class="auth-card" id="register-form">
      <img src="/images/logo.svg" alt="VTM Chat" class="auth-logo" width="44" height="44" />
      <h1>Create your account</h1>
      <p class="subtitle">Join the VTM workspace</p>

      <p class="error-msg" id="error-msg" style="display:none;"></p>

      <div class="field">
        <label for="displayName">Full name</label>
        <input type="text" id="displayName" required minlength="2" maxlength="50" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Create account</button>

      <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await api.register({
          displayName: document.getElementById('displayName').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = '/';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
